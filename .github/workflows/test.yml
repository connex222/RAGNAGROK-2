# Runs every test on GitHub's computers each time you push or open a pull request.
# A red cross on the commit means something broke; click it to see which test.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:protocol-acceptance
      - run: npm run test:modes
      - run: npm run test:phase9:offline
      - run: npm run test:phase9:network
      - run: node test/phase11-balanced-audit.js 14
      - run: node test/phase11-emergency-sensitivity.js 7
